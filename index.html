<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Személyes pénzügyi követő: bevételek, kiadások, előrejelzés és megtakarítási célok." />
    <title>Pénziránytű</title>
    <script>
      (function () {
        try {
          const raw = localStorage.getItem('penziranytu-v1')
          const theme = raw ? (JSON.parse(raw)?.settings?.theme ?? 'dark') : 'dark'
          const dark =
            theme !== 'light' &&
            (theme === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
